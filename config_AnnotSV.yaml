---
#### General annotations on the SV
##################################
AnnotSV_ID:    #mandatory in first position
    POSITION: 1
    RENAME: "AnnotSV ID"
### CytoBand — chromosomal location of the SV (UCSC cytogenetic band)
######################################################################
CytoBand:
    POSITION: 2
    RENAME: "CytoBand"
    HEADERTIPS: "UCSC cytogenetic band overlapped by the SV (e.g. 21q22.12). Useful chromosome-context anchor right after the AnnotSV ID."
### Caller variant ID and ALT allele
######################################
# `ID` is the original SV caller's variant identifier (Severus / SAVANA /
# MINDA), copied through from the input VCF. Pairs naturally with CytoBand
# as a per-record handle to grep / cross-reference against caller logs.
# `ALT` is the symbolic allele notation written by ADD_CALLER:
#   - non-BND records: `<DEL>` / `<DUP>` / `<INS>` / `<INV>` (the literal
#     inserted sequence is replaced for INS so the table stays readable)
#   - BND records: bracket notation `N[chrX:Y[` / `[chrX:Y[N` / etc., which
#     carries the partner-breakpoint coordinate inline.
ID:
    POSITION: 3
    RENAME: "Caller ID"
    HEADERTIPS: "Original variant ID from the SV caller (e.g. severus_DEL3960). Carried through from the input VCF; useful for back-referencing the raw caller output."
ALT:
    POSITION: 4
    RENAME: "ALT"
    HEADERTIPS: "Alternate allele in VCF notation. Symbolic (`<DEL>`, `<DUP>`, `<INS>`, `<INV>`) for non-BND records; bracket notation `N[chrX:Y[` / `[chrX:Y[N` / `N]chrX:Y]` / `]chrX:Y]N` for BND records, which encodes the partner-breakpoint coordinate."

ACMG_class:  # mandatory   
    POSITION: 5
    RENAME: "ACMG class"
    HEADERTIPS: "SV ranking class (from 1 to 5) following the 2020 joint consensus recommendation of ACMG and ClinGen"
    COMMENTLIST:
        - AnnotSV_ranking_score
        - AnnotSV_ranking_criteria
SV_type:
    POSITION: 6
    RENAME: "SV type"
    HEADERTIPS: "Type of the SV (DEL, DUP...)"
    COMMENTLIST:
        - SV_length
        - Gene_count

Annotation_mode: #mandatory
    POSITION: 7
    RENAME: "Annotation mode"
    HEADERTIPS: "Type of annotation lines generated:<br>
- annotation on the SV full length (full)<br>
- annotation on each gene overlapped by the SV (split)"

### Gene annotations
####################
Gene_name:     # mandatory
    POSITION: 8
    RENAME: "Gene name"
    HEADERTIPS: "Gene symbol"
    COMMENTLIST:
        - LOEUF_bin
        - GnomAD_pLI
        - ExAC_pLI
        - HI
        - TS
        - DDD_HI_percent
        - ACMG
        - ExAC_cnvZ
        - ExAC_delZ
        - ExAC_dupZ
        - ExAC_synZ
        - ExAC_misZ
        - GenCC_disease
        - GenCC_moi
        - GenCC_classification
        - GenCC_pmid
        - Closest_left
        - Closest_right
        - NCBI_gene_ID
Location:
    POSITION: 10
    RENAME: "Location"
    HEADERTIPS: "Hover your mouse to highlight SV location annotations in the gene"
    COMMENTLIST:
        - CytoBand
        - Location2
        - Tx
        - Tx_version
        - Tx_start
        - Tx_end
        - Exon_count
        - Overlapped_tx_length
        - Overlapped_CDS_length
        - Overlapped_CDS_percent
        - Frameshift
        - Dist_nearest_SS
        - Nearest_SS_type
        - Intersect_start
        - Intersect_end
OMIM_ID:
    POSITION: 11
    RENAME: "OMIM ID"
    HEADERTIPS: "Hover your mouse to highlight OMIM annotations"
    COMMENTLIST:
        - OMIM_phenotype
        - OMIM_inheritance
        - OMIM_morbid
        - OMIM_morbid_candidate
Exomiser_gene_pheno_score:
    POSITION: 12
    RENAME: "Exomiser score"
    HEADERTIPS: "Show how close each overlapped gene is to the patient phenotype<br>
    Highly specific and consistent phenotype: score > 0.7<br>
    Consistent phenotype: score > 0.5"
    COMMENTLIST:
        - Human_pheno_evidence
        - Mouse_pheno_evidence
        - Fish_pheno_evidence
PhenoGenius_specificity:
    POSITION: 13
    RENAME: "PhenoGenius specificity"
    HEADERTIPS: "Phenotype specificity into one of A, B, C, D or . :<br>
    A - Highly specific and relatively unique to the gene<br>
    B - Consistent with the gene, highly specific, but not necessarily unique to the gene<br>
    C - Limited association with the gene, not highly specific and/or with high genetic heterogeneity<br>
    D - Not consistent with what is expected for the gene/genomic region or not consistent in general<br>
    . - No reported phenotype"
    COMMENTLIST:
    - PhenoGenius_phenotype
    - PhenoGenius_score

### Annotations done with regulatory elements
#############################################
RE_gene:
    POSITION: 14
    RENAME: "Overlapped regulatory elements"
    HEADERTIPS: "Report the name of the genes potentially badly regulated"
Gene_count:
    POSITION: 9
    RENAME: "Gene count"
    HEADERTIPS: "Number of genes overlapped by the SV (AnnotSV Gene_count). Pairs with Gene_name for an at-a-glance breadth-of-impact cue."

### Annotations done with pathogenic SV
#######################################
P_gain_coord:
    POSITION: 15
    RENAME: "Pathogenic SV"
    HEADERTIPS: "Known pathogenic genes or genomic regions (with the same SV type; from ClinVar, ClinGen, dbVar, OMIM) completely overlapped with the SV to annotate"
    COMMENTLIST:
        - P_gain_source
        - P_gain_phen
        - P_gain_hpo
        - P_loss_coord
        - P_loss_source
        - P_loss_phen
        - P_loss_hpo
        - po_P_gain_phen
        - po_P_gain_hpo
        - po_P_gain_source
        - po_P_gain_coord
        - po_P_gain_percent
        - po_P_loss_phen
        - po_P_loss_hpo
        - po_P_loss_source
        - po_P_loss_coord
        - po_P_loss_percent

### Annotations done with pathogenic snv/indel
##############################################
P_snvindel_nb:
    POSITION: 16
    RENAME: "Number of pathogenic SNV/indel overlapped"
    HEADERTIPS: "Pathogenic SNV/indel (from ClinVar) completely overlapped with the SV to annotate"
    COMMENTLIST:
        - P_snvindel_phen

### Annotations done with benign SV
###################################
B_gain_source:
    POSITION: 17
    RENAME: "Benign SV"
    HEADERTIPS: "Benign genomic regions (with the same SV type; from gnomAD, ClinVar, ClinGen, DGV, DDD, 1000g, IMH) completely overlapping the SV to annotate"
    COMMENTLIST:
