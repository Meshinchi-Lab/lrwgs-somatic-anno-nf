TAD_coordinate:
    POSITION: 0
ENCODE_experiment:
    POSITION: 0
Cosmic_ID:
    POSITION: 0
Cosmic_mut_typ:
    POSITION: 0
Compound-htz(sample):
    POSITION: 0
Count_hom(sample):
    POSITION: 0
Count_htz(sample):
    POSITION: 0
Count_htz/allHom(sample):
    POSITION: 0
Count_htz/total(cohort):
    POSITION: 0
Count_total(cohort):
    POSITION: 0

### Caller provenance
#####################
# CALLER is merged into the AnnotSV TSV by the ADD_CALLER process, which
# extracts the VCF INFO/CALLER field via vembrane/table on the merged VCF
# and joins it to the AnnotSV TSV by ID.  This replaces AnnotSV's bloated
# full-INFO column (kept out of the report by setting INFO POSITION: 0).
CALLER:
    POSITION: 20
    RENAME: "Caller"
    HEADERTIPS: "Variant caller: SEVERUS, SAVANA, or MINDA (consensus of both)"

### Per-sample read support — joined into the AnnotSV TSV by ADD_CALLER
########################################################################
# vembrane/table extracts FORMAT[VAF|hVAF|DR|DV][SAMPLE] from the merged
# VCF; add_caller.py left-joins it onto the AnnotSV TSV by ID. These four
# fields are critical clinical context (allelic burden + read support)
# that AnnotSV does not surface itself.
VAF:
    POSITION: 21
    RENAME: "VAF"
    HEADERTIPS: "Variant allele frequency (fraction of reads supporting the SV at this breakpoint). Severus/SAVANA FORMAT/VAF."
hVAF:
    POSITION: 22
    RENAME: "hVAF (H0,H1,H2)"
    HEADERTIPS: "Haplotype-specific VAF as (unphased, HP1, HP2). Useful for confirming somatic SVs sit on one haplotype."
DR:
    POSITION: 23
    RENAME: "DR (ref reads)"
    HEADERTIPS: "Reference-supporting read depth at the breakpoint (FORMAT/DR)."
DV:
    POSITION: 24
    RENAME: "DV (alt reads)"
    HEADERTIPS: "Variant-supporting read depth at the breakpoint (FORMAT/DV)."

INFO:
    POSITION: 0

### Candidate cancer gene annotations
######################################
# Computed by ADD_CALLER (bin/add_caller.py) as the intersection of each
# row's `Gene_name` (the ';'-separated list of all genes overlapped by the
# SV) with the user's candidate-gene list (params.candidateGenesFile —
# e.g. ST9.alterations_OncoKB_cancer_genes.txt). AnnotSV's own
# -candidateGenesFile flag only adjusts the AnnotSV_ranking_score; it does
# NOT emit a per-row list of which candidate genes the SV overlaps. This
# column fills that gap so the report shows the actual T-ALL driver hits.
Candidate_genes:
    POSITION: 25
    RENAME: "Candidate cancer genes"
    HEADERTIPS: "Subset of `Gene_name` that intersects the user-supplied candidate-gene list (params.candidateGenesFile). Empty when no candidate gene is overlapped by the SV's coordinate interval."

### User-defined SV alteration annotations — ST17 BED overlap
###############################################################
# Each BED file passed to AnnotSV via -FtIncludedInSV / -AnyOverlap
# produces three TSV columns prefixed with the column name from the BED
# header line: name_<basename>, score_<basename>, strand_<basename>. The
# primary column knotAnnotSV renders is name_<basename>; score_ and strand_
# are surfaced in the tooltip via COMMENTLIST.
# BND lives in AnyOverlap (breakends rarely fully overlap a region);
# DEL/DUP/INS/INV live in FtIncludedInSV.
name_ST17_Alterations.SV.All_BND:
    POSITION: 26
    RENAME: "ST17 BND overlap"
    HEADERTIPS: "Overlapping ST17 BND alteration region (AnyOverlap)"
    COMMENTLIST:
        - score_ST17_Alterations.SV.All_BND
        - strand_ST17_Alterations.SV.All_BND

name_ST17_Alterations.SV.All_DEL:
    POSITION: 27
    RENAME: "ST17 DEL overlap"
    HEADERTIPS: "Overlapping ST17 DEL alteration region (FtIncludedInSV)"
    COMMENTLIST:
        - score_ST17_Alterations.SV.All_DEL
        - strand_ST17_Alterations.SV.All_DEL

name_ST17_Alterations.SV.All_DUP:
    POSITION: 28
    RENAME: "ST17 DUP overlap"
    HEADERTIPS: "Overlapping ST17 DUP alteration region (FtIncludedInSV)"
    COMMENTLIST:
        - score_ST17_Alterations.SV.All_DUP
        - strand_ST17_Alterations.SV.All_DUP

name_ST17_Alterations.SV.All_INS:
    POSITION: 29
    RENAME: "ST17 INS overlap"
    HEADERTIPS: "Overlapping ST17 INS alteration region (FtIncludedInSV)"
    COMMENTLIST:
        - score_ST17_Alterations.SV.All_INS
        - strand_ST17_Alterations.SV.All_INS

name_ST17_Alterations.SV.All_INV:
    POSITION: 30
    RENAME: "ST17 INV overlap"
    HEADERTIPS: "Overlapping ST17 INV alteration region (FtIncludedInSV)"
    COMMENTLIST:
        - score_ST17_Alterations.SV.All_INV
        - strand_ST17_Alterations.SV.All_INV

