# assets/genomic_viz/circos/tracks.conf
# Each `show = conf(<flag>)` reads a top-level parameter from circos.conf, which
# the CIRCOS module overrides with `-param show_<track>=no` when the matching
# data file has zero lines. Data file names are FIXED: the module stages its
# inputs as links.txt, cna.txt, labels.txt.
#
# Radii: values < 1r resolve against the ideogram INNER radius, values >= 1r
# against its OUTER radius; "Np" are absolute pixels on the 1500p canvas.
<plots>

# Tier-1 gene labels, outside the ideogram: start clear of the tick labels and
# their leader lines, capped in pixels so snuggled stacks stay on the canvas
# (room for 2-3 stacked rows; labels that do not fit are left out, not clipped).
<plot>
show           = conf(show_labels)
type           = text
file           = labels.txt
r0             = 1r+60p
r1             = 1490p
label_size     = 22p
label_font     = bold
color          = black
show_links     = yes
link_dims      = 2p,4p,6p,4p,2p
link_thickness = 1p
link_color     = dgrey
label_snuggle  = yes
</plot>

# Copy-number segments. margin = 0u: Wakhan emits abutting / 1-bp-overlapping
# segments of one event and the default 10 kb margin made circos DROP them.
# layers_overflow = collapse: anything beyond tile_layers is still drawn (on the
# first, innermost layer) instead of being hidden. tile_layers is 1 per sample,
# 6 for the cohort ring, where overlapping segments stack outward; a sample's own
# 1-bp-overlapping fragments can occupy two layers, so layer != sample.
<plot>
show             = conf(show_cna)
type             = tile
file             = cna.txt
r0               = 0.80r
r1               = 0.93r
layers           = conf(tile_layers)
layers_overflow  = collapse
margin           = 0u
thickness        = 12p
padding          = 2p
orientation      = out
stroke_thickness = 0
</plot>

</plots>

# SV links. Colour (tier), thickness (recurrence) and z (draw order) come from
# the per-link options written by COHORT_TO_CIRCOS; the values here are defaults
# for lines that carry no options. The flag is show_sv_links, not show_links,
# because the text track above has its own show_links (label leader lines).
<links>
<link>
show          = conf(show_sv_links)
file          = links.txt
radius        = 0.78r
bezier_radius = 0r
ribbon        = no
thickness     = 2p
color         = tier3
<rules>
# Intrachromosomal DEL/DUP/INV would draw as spikes to the centre with
# bezier_radius 0r; draw them as a shallow inward loop instead.
<rule>
condition     = var(intrachr)
bezier_radius = 0.6r
</rule>
</rules>
</link>
</links>
