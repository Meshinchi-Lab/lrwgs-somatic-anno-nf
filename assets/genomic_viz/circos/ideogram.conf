# assets/genomic_viz/circos/ideogram.conf
<ideogram>
<spacing>
default = 0.004r
</spacing>
# 0.75r leaves room outside the ring for the tick labels and the snuggled Tier-1
# gene labels (tracks.conf); at 0.88r the labels ran off the 1500p canvas.
radius            = 0.75r
thickness         = 40p
# No ideogram fill: circos takes the fill colour from the karyotype's own colour
# column (UCSC rainbow) regardless of fill_color, and those colours competed with
# the red/blue copy-number tiles and the green Tier-1 links. The OPAQUE cytobands
# below cover every chromosome in the hg38 karyotype, so the ring renders greyscale.
fill              = no
stroke_color      = dgrey
stroke_thickness  = 1p
show_label        = yes
label_font        = default
# Chromosome names INSIDE the ring, in the gap between the tile track (r1 0.93r)
# and the ideogram, so they never collide with the gene labels outside.
label_radius      = dims(ideogram,radius_inner) - 40p
label_size        = 30
label_parallel    = yes
show_bands        = yes
fill_bands        = yes
</ideogram>
