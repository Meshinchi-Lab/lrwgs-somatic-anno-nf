# assets/genomic_viz/circos/palette.conf
# Named colours used by tracks.conf and by the data files COHORT_TO_CIRCOS writes.
# Not called colors.conf: that name would shadow circos's own etc/colors.conf on
# the include path and surface later as "undefined colour tier3".
# Tier colours match sv_report_index.qmd (T1 green, T2 orange, T3 grey).
tier1 = 44,160,44
tier2 = 214,137,16
tier3 = 108,117,125
# Copy number: ColorBrewer RdYlBu-9 extremes (colourblind-safe red / blue).
gain  = 215,48,39
loss  = 69,117,180
# Centromere band colour shipped with circos (217,47,39) is nearly the gain red;
# override it so the ideogram never looks like a copy-number gain.
acen* = 150,150,150
# Likewise the short-arm stalk bands (slate blue, close to the loss blue).
stalk* = 180,180,180
