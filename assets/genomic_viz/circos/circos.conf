# assets/genomic_viz/circos/circos.conf
# Top-level flags overridden per run with `-param name=value` (see CIRCOS module).
show_sv_links = yes
show_cna      = yes
show_labels   = yes
tile_layers   = 1

# The hg38 karyotype shipped with circos (hs1..hs22, hsX, hsY with cytobands),
# resolved through circos's own data search path (<circos root>/data), so no
# install-specific path is embedded and no symlink is needed.
karyotype                   = data/karyotype/karyotype.human.hg38.txt
chromosomes_units           = 1000000
chromosomes_display_default = yes

<<include ideogram.conf>>
<<include ticks.conf>>
<<include tracks.conf>>

<image>
<<include etc/image.conf>>
# These pin the shipped defaults (1500p, png + svg) so the module can rely on
# both output files regardless of the base config.
radius*            = 1500p
png*               = yes
svg*               = yes
auto_alpha_colors* = yes
auto_alpha_steps*  = 5
</image>

<colors>
<<include palette.conf>>
</colors>
<<include etc/colors_fonts_patterns.conf>>
<<include etc/housekeeping.conf>>
# housekeeping.conf ships 25000 for both; a 50-sample cohort with unmerged Wakhan
# segments can approach that, and exceeding it is a fatal error. `*` overrides the
# included value wherever it appears.
max_links*            = 100000
max_points_per_track* = 100000
